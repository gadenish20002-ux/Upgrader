services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: upgrader-app:${UPGRADER_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:-postgresql://upgrader:upgrader@postgres:5432/upgrader}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CRON_SECRET: ${CRON_SECRET:-change-me-before-public-cron}
      CATALOG_STEAM_USD_MULTIPLIER: ${CATALOG_STEAM_USD_MULTIPLIER:-78}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - upgrader
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-upgrader}
      POSTGRES_USER: ${POSTGRES_USER:-upgrader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-upgrader}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - upgrader
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-upgrader} -d $${POSTGRES_DB:-upgrader}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    networks:
      - upgrader
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      UPGRADER_DOMAIN: ${UPGRADER_DOMAIN:-upgrader.pro.upgrader.ru}
      CADDY_EMAIL: ${CADDY_EMAIL:-admin@upgrader.pro}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - upgrader
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  upgrader:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
