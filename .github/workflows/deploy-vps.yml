name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_KEY"
          VPS_PORT="${VPS_PORT:-22}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/upgrader_vps
          chmod 600 ~/.ssh/upgrader_vps
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy selected commit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          VPS_PORT="${VPS_PORT:-22}"
          VPS_USER="${VPS_USER:-upgrader}"
          VPS_DEPLOY_PATH="${VPS_DEPLOY_PATH:-/opt/upgrader}"
          ssh -i ~/.ssh/upgrader_vps -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "cd '$VPS_DEPLOY_PATH' && if ! APP_DIR='$VPS_DEPLOY_PATH' ./scripts/deploy-vps.sh '$DEPLOY_SHA'; then APP_DIR='$VPS_DEPLOY_PATH' ./scripts/rollback-vps.sh; exit 1; fi"
